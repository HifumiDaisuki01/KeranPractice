name: KeranPractice v2
on:
  push:
    branches: [rewrite/v2.0]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/KeranPractice/KeranPractice.csproj -c Release
      - run: dotnet test tests/KeranPractice.Tests/KeranPractice.Tests.csproj -c Release --logger trx --results-directory artifacts/tests
      - run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: KeranPractice-v2-review-build
          path: artifacts/
