name: KeranPractice .NET 10 validation
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore KeranPractice.csproj
      - name: Compile
        run: dotnet build KeranPractice.csproj -c Release --no-restore -warnaserror
      - name: Publish assembly
        uses: actions/upload-artifact@v4
        with:
          name: KeranPractice-ci-net10
          path: bin/Release/net10.0/KeranPractice.dll
          if-no-files-found: error
